<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05030d"><title>Kocham Cię Michasia — kwiaty</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03020b;color:white;font-family:Georgia,serif}body{background:radial-gradient(ellipse at 50% 58%,#1a0b29 0%,#090517 49%,#020207 100%)}#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}main{position:relative;width:100%;height:100dvh;min-height:450px;overflow:hidden}.bouquet{position:absolute;left:50%;bottom:-1.5%;height:min(82vh,780px);width:min(98vw,820px);transform:translateX(-50%);overflow:visible;filter:drop-shadow(0 0 14px #a64ed51a)}.stem{fill:none;stroke:#4d965c;stroke-width:5;stroke-linecap:round;stroke-dasharray:650;stroke-dashoffset:650;animation:grow 2.8s ease-out forwards}.stem.secondary{stroke:#315f48;stroke-width:2.4}.leaf{fill:url(#leaf);stroke:#74c387;stroke-width:1;transform-box:fill-box;transform-origin:0% 85%;transform:scale(.05);animation:leafOpen 1.4s cubic-bezier(.2,1.3,.3,1) forwards}.flower{overflow:visible;opacity:0;animation:appear .35s forwards}.petal{transform-box:fill-box;transform-origin:50% 96%;transform:scale(.04,.03) rotate(var(--twist));opacity:0;animation:bloom 2.3s cubic-bezier(.12,.8,.19,1.05) forwards;filter:drop-shadow(0 0 6px var(--glow))}.innerPetal{transform-origin:50% 95%;animation-duration:2.6s}.flower-center{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.1);animation:centerOpen 1s ease-out forwards}.vein{fill:none;stroke:#fff5;stroke-width:.9;stroke-linecap:round}.twinkle{animation:twinkle 2s ease-in-out infinite alternate}.caption{position:absolute;z-index:5;top:4%;left:0;width:100%;display:flex;justify-content:center;pointer-events:none}.morph{width:min(94vw,650px);height:125px;filter:drop-shadow(0 0 12px #ec7ca477)}.replay{position:fixed;z-index:10;right:15px;bottom:14px;border:1px solid #dba4e15c;color:#ffe8ff;background:#1b0c28d9;border-radius:22px;padding:10px 16px;font:13px system-ui;cursor:pointer}.replay:hover{background:#402052}@keyframes grow{to{stroke-dashoffset:0}}@keyframes leafOpen{to{transform:scale(1)}}@keyframes appear{to{opacity:1}}@keyframes bloom{0%{transform:scale(.04,.03) rotate(var(--twist));opacity:0}35%{opacity:1}70%{transform:scale(1.08,1.06) rotate(0)}100%{transform:scale(1) rotate(0);opacity:1}}@keyframes centerOpen{to{opacity:1;transform:scale(1)}}@keyframes twinkle{from{opacity:.15}to{opacity:1}}@media(max-width:600px){.bouquet{height:76vh;width:125vw;bottom:0}.caption{top:2%}.morph{height:105px}.replay{font-size:12px}}
</style></head><body><canvas id="sky"></canvas><main><div class="caption"><canvas class="morph" id="morph" aria-label="Panterka zmieniająca się w napis Kocham Cię Michasia"></canvas></div><svg class="bouquet" id="flowers" viewBox="0 0 800 770" preserveAspectRatio="xMidYMax meet" role="img" aria-label="Animowany bukiet różowych, fioletowych i czerwonych kwiatów"><defs>
<linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7fda91"/><stop offset=".45" stop-color="#327c52"/><stop offset="1" stop-color="#173b34"/></linearGradient>
<radialGradient id="pink"><stop stop-color="#fff0f9"/><stop offset=".33" stop-color="#ffa4d7"/><stop offset=".8" stop-color="#ee4fa5"/><stop offset="1" stop-color="#9b216e"/></radialGradient>
<radialGradient id="purple"><stop stop-color="#f9e3ff"/><stop offset=".32" stop-color="#d995ff"/><stop offset=".8" stop-color="#9e4de2"/><stop offset="1" stop-color="#59258b"/></radialGradient>
<radialGradient id="red"><stop stop-color="#ffe2e9"/><stop offset=".32" stop-color="#ff7c98"/><stop offset=".8" stop-color="#d92357"/><stop offset="1" stop-color="#87143a"/></radialGradient>
<pattern id="leopard" patternUnits="userSpaceOnUse" width="29" height="27"><rect width="29" height="27" fill="#e5a0b6"/><path d="M5 5 Q10 0 15 5 M17 8 Q23 10 22 17 M12 20 Q7 24 3 17" fill="none" stroke="#39202e" stroke-width="4" stroke-linecap="round"/><path d="M7 10 Q13 6 15 12 M22 22 l4 2" fill="none" stroke="#603345" stroke-width="3"/></pattern>
</defs><g id="stems"></g><g id="blooms"></g></svg><button class="replay" id="replay">↻ Odtwórz animację</button></main>
<script>
const NS='http://www.w3.org/2000/svg',stemGroup=document.getElementById('stems'),bloomGroup=document.getElementById('blooms');
function el(tag,attrs,parent){const n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs||{}))n.setAttribute(k,v);(parent||bloomGroup).appendChild(n);return n}
// Kwiaty ułożone na różnych wysokościach, bez zasłaniania się nawzajem.
const specs=[
[399,170,1.08,'purple',1.15],[280,224,1.06,'pink',1.6],[515,225,1.07,'pink',1.8],
[172,304,1.04,'purple',2.15],[393,310,1.18,'red',2.35],[626,305,1.04,'purple',2.5],
[272,389,1.12,'purple',2.8],[511,390,1.14,'pink',3.0],
[112,430,.91,'pink',3.2],[680,432,.91,'red',3.4],
[378,471,1.15,'pink',3.6],[198,515,.94,'red',3.8],[586,518,.95,'purple',4.0],
[298,570,.89,'pink',4.15],[489,570,.89,'purple',4.3]
];
function make(){stemGroup.replaceChildren();bloomGroup.replaceChildren();specs.forEach(([x,y,s,color,delay],idx)=>{
 const bx=399+(x-399)*.12,by=765,ctrlX=(x+bx)/2+(x>399? -25:25);
 el('path',{d:`M ${bx} ${by} Q ${ctrlX} ${y+210} ${x} ${y+12}`,class:'stem',style:`animation-delay:${idx*.105}s`},stemGroup);
 for(let side of [-1,1]){let t=.45+side*.14, lx=bx+(x-bx)*t,ly=by+(y+12-by)*t-30;let g=el('g',{transform:`translate(${lx} ${ly}) rotate(${side*48})`},stemGroup);el('path',{d:`M0 0 Q ${side*30} -47 ${side*71} -46 Q ${side*47} -9 0 0`,class:'leaf',style:`animation-delay:${1.15+idx*.11}s`},g)}
 const f=el('g',{class:'flower',transform:`translate(${x} ${y}) scale(${s})`,style:`animation-delay:${delay-.12}s`});
 // Warstwy płatków rozchylają się od podstawy kwiatu, zamiast pojawiać się nagle.
 for(let layer=0;layer<2;layer++)for(let p=0;p<6;p++){
  let angle=p*60+(layer?30:0),r=layer?21:33,scale=layer?.76:1;
  let g=el('g',{transform:`rotate(${angle}) translate(0 ${-r}) scale(${scale})`},f);
  el('path',{d:'M0 21 C-21 8 -38 -18 -30 -54 C-26 -80 -8 -93 0 -96 C8 -93 26 -80 30 -54 C38 -18 21 8 0 21Z',fill:`url(#${color})`,stroke:color==='red'?'#ff9eb7':'#f9b4f3','stroke-width':'.9',class:`petal ${layer?'innerPetal':''}`,style:`--twist:${p%2?25:-25}deg;--glow:${color==='purple'?'#ad61f9':color==='red'?'#ff426c':'#fa70c0'};animation-delay:${delay+layer*.28+p*.07}s`},g);
  el('path',{d:'M0 8 Q-4 -28 0 -77',class:'vein',style:`opacity:.45;animation:twinkle 3s ${delay+p*.1}s infinite alternate`},g)
 }
 const mid=el('g',{class:'flower-center',style:`animation-delay:${delay+1.6}s`},f);
 el('circle',{r:18,fill:'url(#leopard)',stroke:'#f7bdd7','stroke-width':3},mid);
 for(let i=0;i<6;i++){let a=i*Math.PI/3;el('ellipse',{cx:Math.cos(a)*10,cy:Math.sin(a)*10,rx:2.2,ry:3.2,fill:'#3a1c30'},mid)}
 });}
make();
// Dużo spadających gwiazd: osobna warstwa canvas.
const sky=document.getElementById('sky'),sc=sky.getContext('2d');let sw,sh,dpr,stars=[];
function resizeSky(){dpr=Math.min(devicePixelRatio||1,2);sw=innerWidth;sh=innerHeight;sky.width=sw*dpr;sky.height=sh*dpr;sc.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.min(310,Math.floor(sw*sh/2200))},()=>({x:Math.random()*sw,y:Math.random()*sh,v:12+Math.random()*42,r:.35+Math.random()*1.45,a:Math.random()*6.28,kind:Math.random()}))}window.addEventListener('resize',resizeSky);resizeSky();
let last=performance.now();function skyFrame(t){let dt=Math.min((t-last)/1000,.05);last=t;sc.clearRect(0,0,sw,sh);for(const st of stars){st.y+=st.v*dt;st.x-=st.v*.18*dt;if(st.y>sh+10){st.y=-10;st.x=Math.random()*sw}if(st.x<0)st.x=sw;let alpha=.25+.6*(.5+.5*Math.sin(t*.002+st.a));sc.fillStyle=st.kind>.7?`rgba(244,169,245,${alpha})`:`rgba(237,234,255,${alpha})`;sc.beginPath();sc.arc(st.x,st.y,st.r,0,Math.PI*2);sc.fill();if(st.kind>.94){sc.strokeStyle=`rgba(244,195,255,${alpha*.7})`;sc.beginPath();sc.moveTo(st.x-4,st.y);sc.lineTo(st.x+4,st.y);sc.moveTo(st.x,st.y-4);sc.lineTo(st.x,st.y+4);sc.stroke()}}requestAnimationFrame(skyFrame)}requestAnimationFrame(skyFrame);
// Panterka przechodzi w napis, którego wypełnienie ma wzór prawdziwych cętek.
const morph=document.getElementById('morph'),mc=morph.getContext('2d');let mw,mh,particles=[],morphStart=performance.now();
function targetPoints(draw){let cv=document.createElement('canvas');cv.width=mw;cv.height=mh;let c=cv.getContext('2d');draw(c);let data=c.getImageData(0,0,mw,mh).data,pts=[];for(let y=2;y<mh;y+=3)for(let x=2;x<mw;x+=3)if(data[(y*mw+x)*4+3]>105)pts.push([x,y]);return pts.sort(()=>Math.random()-.5)}
function setupMorph(){let w=morph.clientWidth,h=morph.clientHeight;mw=Math.round(w);mh=Math.round(h);morph.width=mw*devicePixelRatio;morph.height=mh*devicePixelRatio;mc.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
 const animal=targetPoints(c=>{c.textAlign='center';c.textBaseline='middle';c.font=`${Math.min(82,mh*.78)}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`;c.fillText('🐆',mw/2,mh/2)});
 const words=targetPoints(c=>{c.textAlign='center';c.textBaseline='middle';c.font=`bold ${Math.min(49,mw/13.8)}px Georgia,serif`;c.fillText('Kocham Cię',mw/2,mh*.34);c.font=`bold ${Math.min(48,mw/12.5)}px Georgia,serif`;c.fillText('Michasia',mw/2,mh*.77)});
 const count=Math.max(animal.length,words.length);particles=Array.from({length:count},(_,i)=>({a:animal[i%Math.max(1,animal.length)]||[mw/2,mh/2],b:words[i%words.length],offset:Math.random()*1.3,seed:Math.random()}));morphStart=performance.now()}
window.addEventListener('resize',setupMorph);setupMorph();
function morphFrame(t){let elapsed=(t-morphStart)/1000;mc.clearRect(0,0,mw,mh);let k=Math.max(0,Math.min(1,(elapsed-2.0)/2.8));k=k*k*(3-2*k);for(let p of particles){let x=p.a[0]*(1-k)+p.b[0]*k,y=p.a[1]*(1-k)+p.b[1]*k;let spot=((Math.floor(p.b[0]/9)*7+Math.floor(p.b[1]/7)*11)%13);mc.fillStyle=spot<4?'#2d1428':spot<6?'#63334c':p.seed>.75?'#ffd4e9':'#f0a0c6';mc.globalAlpha=.7+.3*Math.sin(t*.002+p.offset);mc.fillRect(x,y,2.8,2.8)}mc.globalAlpha=1;requestAnimationFrame(morphFrame)}requestAnimationFrame(morphFrame);
document.getElementById('replay').addEventListener('click',()=>{make();setupMorph()});
</script></body></html>
